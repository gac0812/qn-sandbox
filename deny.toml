[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # MPL-2.0：弱 copyleft（文件级不传染），仅为已批准依赖的传递依赖放行
    # （dirs → option-ext）。当前 cargo-deny 版本的 licenses.exceptions 不支持
    # per-crate 键，无法机器精确化——"仅限传递"由 spec 04 §2 规定、人评强制。
    "MPL-2.0",
    # webpki-roots (via ureq -> rustls in qn-nono installer) bundles the
    # Mozilla root certificate store as data under CDLA-Permissive-2.0.
    # Data-only, redistribution-permissive; see qn-nono installer PR (issue #29).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
