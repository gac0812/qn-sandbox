const bg = document.getElementById('bg'); bg.width = W; bg.height = H; const b = bg.getContext('2d');

const ramp = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 175, 175, 175, 255, 255, 255, 255, 255]), 3, 1);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const toon = (c, extra = {}) => new THREE.MeshToonMaterial({ color: c, gradientMap: ramp, ...extra });
const INK = 0x2a1a14;
const inkMat = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });
function outlined(geo, mat, s = 1.06) {
  const g = new THREE.Group();
  const m = new THREE.Mesh(geo, mat); g.add(m);
  const o = new THREE.Mesh(geo, inkMat); o.scale.setScalar(s); g.add(o);
  return g;
}

scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(-120, 260, 200); scene.add(sun);

// ---- sandbox: glass room with chunky inked edges ----
const BW = 190, BH = 120, BD = 130;
const room = new THREE.Group(); scene.add(room);
const floor = outlined(new RoundedBoxGeometry(BW + 16, 12, BD + 16, 3, 4), toon(0xF3D9C4), 1.02);
floor.position.y = -6; room.add(floor);
const glass = new THREE.Mesh(new RoundedBoxGeometry(BW, BH, BD, 3, 8),
  new THREE.MeshToonMaterial({ color: 0xBDE7F2, gradientMap: ramp, transparent: true, opacity: 0.12, depthWrite: false }));
glass.position.y = BH / 2; room.add(glass);
// edges as tubes
const edgeMat = new THREE.MeshBasicMaterial({ color: INK });
const hx = BW / 2, hy = BH, hz = BD / 2;
const corners = [[-hx, 0, -hz], [hx, 0, -hz], [hx, 0, hz], [-hx, 0, hz]];
const edges = [];
for (let i = 0; i < 4; i++) {
  const a = corners[i], c = corners[(i + 1) % 4];
  edges.push([[a[0], hy, a[2]], [c[0], hy, c[2]]]);
  edges.push([a, [a[0], hy, a[2]]]);
}
for (const [p, q] of edges) {
  const v1 = new THREE.Vector3(...p), v2 = new THREE.Vector3(...q);
  const geo = new THREE.CylinderGeometry(1.6, 1.6, v1.distanceTo(v2), 8);
  const m = new THREE.Mesh(geo, edgeMat);
  m.position.copy(v1).add(v2).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v2.clone().sub(v1).normalize());
  room.add(m);
}
// glass glints
const glint = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
for (const [x, w] of [[-60, 10], [-40, 4]]) {
  const g = new THREE.Mesh(new THREE.PlaneGeometry(w, 70), glint);
  g.position.set(x, 70, hz + 0.5); g.rotation.z = -0.5; room.add(g);
}
// cozy props
const rug = outlined(new THREE.CylinderGeometry(52, 52, 2, 48), toon(0xE89F84), 1.03); rug.position.set(-5, 1, 15); rug.scale.z = 0.7; room.add(rug);
const cushion = outlined(new RoundedBoxGeometry(46, 14, 30, 4, 7), toon(0x9DB1F0)); cushion.position.set(48, 8, 22); room.add(cushion);
const lampPole = outlined(new THREE.CylinderGeometry(1.6, 1.6, 70, 8), toon(0xC9A88E), 1.4); lampPole.position.set(68, 35, -38); room.add(lampPole);
const shade = outlined(new THREE.CylinderGeometry(9, 16, 18, 24, 1, true), toon(0xFFC96B, { side: THREE.DoubleSide, emissive: 0x553300 })); shade.position.set(68, 74, -38); room.add(shade);
const folder = outlined(new RoundedBoxGeometry(30, 22, 6, 2, 2), toon(0x7FA7E0)); folder.position.set(-62, 13, -40); folder.rotation.y = 0.3; room.add(folder);
const plant = outlined(new THREE.SphereGeometry(10, 16, 12), toon(0x86C79A)); plant.position.set(-78, 22, 30); room.add(plant);

// ---- voxel Clawd: one extruded silhouette (no per-cube seams) + per-cell back-face hulls for the ink line ----
const VX = 4.4;
const filled = (r, c) => r >= 0 && r < 10 && c >= 0 && c < 18 && CLAWD[r][c] !== '.';
function traceShape(isOn, cols, rows, cell, ox, oy) {
  // directed boundary edges with the filled cell on the left, chained into one loop
  const next = new Map();
  const P = (c, r) => `${c},${r}`;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (!isOn(r, c)) continue;
    if (!isOn(r - 1, c)) next.set(P(c + 1, r), P(c, r));
    if (!isOn(r + 1, c)) next.set(P(c, r + 1), P(c + 1, r + 1));
    if (!isOn(r, c - 1)) next.set(P(c, r), P(c, r + 1));
    if (!isOn(r, c + 1)) next.set(P(c + 1, r + 1), P(c + 1, r));
  }
  const start = next.keys().next().value;
  const shape = new THREE.Shape();
  let k = start, first = true;
  do {
    const [c, r] = k.split(',').map(Number);
    const x = ox + c * cell, y = oy - r * cell;
    if (first) { shape.moveTo(x, y); first = false; } else shape.lineTo(x, y);
    k = next.get(k);
  } while (k !== start);
  return shape;
}
const clawdShape = () => traceShape(filled, 18, 10, VX, -9 * VX, 10 * VX);
// outline silhouette: the sprite dilated by 1/4 pixel on a 4× sub-grid
const SUB = 4;
const dilated = (r, c) => {
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const rr = r + dr - 1, cc = c + dc - 1;
    if (filled(Math.floor(rr / SUB), Math.floor(cc / SUB)) && rr >= 0 && cc >= 0) return true;
  }
  return false;
};
const hullShape = () => traceShape(dilated, 18 * SUB + 2, 10 * SUB + 2, VX / SUB, -9 * VX - VX / SUB, 10 * VX + VX / SUB);
const DEPTH = VX * 4;
const bodyGeo = new THREE.ExtrudeGeometry(clawdShape(), { depth: DEPTH, bevelEnabled: false });
bodyGeo.translate(0, 0, -DEPTH / 2);
const clawd = new THREE.Group();
clawd.add(new THREE.Mesh(bodyGeo, toon(new THREE.Color(CLAY))));
const cells = [];
for (let r = 0; r < 10; r++) for (let c = 0; c < 18; c++) if (filled(r, c)) cells.push([r, c, CLAWD[r][c]]);
const hullGeo = new THREE.ExtrudeGeometry(hullShape(), { depth: DEPTH * 1.12, bevelEnabled: false });
hullGeo.translate(0, 0, -DEPTH * 0.56);
clawd.add(new THREE.Mesh(hullGeo, inkMat));
const eyeInst = new THREE.InstancedMesh(new THREE.BoxGeometry(VX, VX, VX * 0.5), toon(0x1E1410), 4);
const mtx = new THREE.Matrix4();
let ei = 0;
cells.forEach(([r, c, ch], i) => {
  const x = (c - 8.5) * VX, y = (9.5 - r) * VX;
    if (ch === 'e') { mtx.makeTranslation(x, y, DEPTH / 2 + VX * 0.2); eyeInst.setMatrixAt(ei++, mtx); }
});
clawd.add(eyeInst);
clawd.position.set(-14, 2, 22); clawd.rotation.y = 0.3;
room.add(clawd);

// handle tag held by Clawd
const tagMat = toon(0xFFF3CF);
const tag = outlined(new RoundedBoxGeometry(34, 12, 1.5, 2, 1.5), tagMat, 1.08);
tag.position.set(34, 20, 44); tag.rotation.set(0, 0.3, 0.3); tag.scale.setScalar(0.8); room.add(tag);

// ---- outside: hook stand + golden key ----
const gold = toon(0xF5BE4B, { emissive: 0x2a1500 });
const stand = new THREE.Group(); stand.position.set(205, 0, -5); scene.add(stand);
const base = outlined(new THREE.CylinderGeometry(22, 26, 8, 32), toon(0xE7D3C2), 1.05); base.position.y = 4; stand.add(base);
const pole = outlined(new THREE.CylinderGeometry(2.4, 2.4, 120, 10), toon(0x9C8577), 1.35); pole.position.y = 64; stand.add(pole);
const arm = outlined(new THREE.CylinderGeometry(2.4, 2.4, 28, 10), toon(0x9C8577), 1.35); arm.rotation.z = Math.PI / 2; arm.position.set(-12, 122, 0); stand.add(arm);
const keyG = new THREE.Group(); keyG.position.set(-24, 120, 0); stand.add(keyG);
const ring = outlined(new THREE.TorusGeometry(4, 1.2, 8, 20), gold, 1.15); ring.position.y = -4; keyG.add(ring);
const bow = outlined(new THREE.TorusGeometry(11, 4.2, 12, 32), gold, 1.1); bow.position.y = -20; keyG.add(bow);
const shaft = outlined(new THREE.BoxGeometry(5, 40, 4), gold, 1.15); shaft.position.y = -53; keyG.add(shaft);
for (const [y, l] of [[-64, 9], [-72, 12]]) { const t = outlined(new THREE.BoxGeometry(l, 5, 4), gold, 1.15); t.position.set(l / 2 + 2, y, 0); keyG.add(t); }

const proj = (obj, dx = 0, dy = 0, dz = 0) => {
  const v = new THREE.Vector3(dx, dy, dz); obj.localToWorld(v); v.project(camera);
  return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H];
};

// ---------- 2D layers ----------
function background() {
  const g = b.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#FFD7B8'); g.addColorStop(1, '#F7A98E');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  // big flat sun shape + hills = illustrated wallpaper
  b.fillStyle = '#FFE9C9'; b.beginPath(); b.arc(1520, 300, 210, 0, 7); b.fill();
  b.fillStyle = '#F39A7E'; b.beginPath(); b.moveTo(0, 760); b.bezierCurveTo(500, 600, 900, 820, 1920, 640); b.lineTo(1920, 1080); b.lineTo(0, 1080); b.fill();
  b.fillStyle = '#E98670'; b.beginPath(); b.moveTo(0, 900); b.bezierCurveTo(700, 760, 1200, 940, 1920, 820); b.lineTo(1920, 1080); b.lineTo(0, 1080); b.fill();
  // halftone dots
  b.fillStyle = 'rgba(160,60,40,0.08)';
  for (let y = 0; y < H; y += 18) for (let x = (y / 18) % 2 ? 9 : 0; x < W; x += 18) {
    const r = 1 + 3.2 * Math.max(0, (y - 500) / 580);

  b.font = '500 19px "JetBrains Mono"'; b.textBaseline = 'alphabetic';
  b.fillStyle = '#9b8778'; b.fillText('~/my-app', tw.x + 24, tw.y + 46);
  b.fillStyle = CLAY; b.fillText('❯', tw.x + 128, tw.y + 46);
  b.fillStyle = '#2a1f1a'; b.fillText('qn run --profile qn/claude-code', tw.x + 154, tw.y + 46);
  b.fillText('       -- claude', tw.x + 154, tw.y + 76);
  b.fillStyle = '#3E9B6F'; b.fillText('✓', tw.x + 24, tw.y + 118);
  b.fillStyle = '#6d5d52'; b.font = '400 18px "Noto Sans SC"'; b.fillText('会话已启动 · 明文凭证 0 · 句柄 1', tw.x + 52, tw.y + 118);
  b.fillStyle = CLAY; b.fillRect(tw.x + 24, tw.y + 146, 11, 22);
  // desktop items, right column
  desktopItem(b, 'drive', '工作盘', 1820, 150);
  desktopItem(b, 'folder', 'my-app', 1820, 270, { selected: true });
  desktopItem(b, 'doc', 'notes.md', 1820, 390);
  macDock(b, ['files', 'browser', 'mail', 'calendar', 'notes', 'music', '|', 'terminal', 'code', 'qn', 'settings', '|', 'downloads', 'trash'],
    { running: ['files', 'browser', 'terminal', 'qn'], size: 62 });
}

function caption(text, en) {
  f.font = '600 30px "Noto Sans SC"';
  const tw = f.measureText(text).width;
  const w = tw + 80, h = 78, x = (W - w) / 2, y = 868;
  f.fillStyle = 'rgba(40,28,22,0.74)'; rr(f, x, y, w, h, 39); f.fill();
  f.fillStyle = '#fff'; f.textAlign = 'center'; f.textBaseline = 'alphabetic'; f.fillText(text, W / 2, y + 40);
  f.font = '500 14px Fredoka'; f.fillStyle = 'rgba(255,255,255,0.65)'; f.fillText(en, W / 2, y + 63);
  f.textAlign = 'left';
}

function burst(cx, cy, r, n, col, seed) {
  const R = mulberry(seed);
  f.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = i / (n * 2) * Math.PI * 2;
    const rad = i % 2 ? r * (0.62 + R() * 0.1) : r * (0.95 + R() * 0.15);
    f.lineTo(cx + Math.cos(a) * rad * 1.25, cy + Math.sin(a) * rad);
  }
  f.closePath();
  f.fillStyle = col; f.fill();
  f.lineWidth = 6; f.strokeStyle = '#2a1a14'; f.stroke();
}

function star(x, y, s, col) {
  f.save(); f.translate(x, y);
  f.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; const rad = i % 2 ? s * 0.28 : s; f.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
  f.closePath(); f.fillStyle = col; f.fill(); f.lineWidth = 3.5; f.strokeStyle = '#2a1a14'; f.stroke();
  f.restore();
}

function sticker(text, en, x, y, rot) {
  f.save(); f.translate(x, y); f.rotate(rot);
  f.font = '400 52px "ZCOOL KuaiLe"';
  const tw = f.measureText(text).width;
  const w = tw + 70, h = 118;
  f.fillStyle = '#2a1a14'; rr(f, -w / 2 + 8, -h / 2 + 10, w, h, 22); f.fill();
  f.fillStyle = '#FFFDF6'; rr(f, -w / 2, -h / 2, w, h, 22); f.fill();
  f.lineWidth = 6; f.strokeStyle = '#2a1a14'; rr(f, -w / 2, -h / 2, w, h, 22); f.stroke();
  f.textAlign = 'center'; f.textBaseline = 'middle';
  // print misregistration
  f.fillStyle = 'rgba(0,170,220,0.55)'; f.fillText(text, -3, -12);
  f.fillStyle = 'rgba(240,60,120,0.55)'; f.fillText(text, 3, -9);
  f.fillStyle = '#2a1a14'; f.fillText(text, 0, -11);
  f.font = '600 20px Fredoka'; f.fillStyle = '#B4583B'; f.fillText(en, 0, 34);
  f.restore();
}

window.render = async (t) => {
  background();
  clawd.position.y = 2;
  renderer.render(scene, camera);
  f.clearRect(0, 0, W, H);
  // speed lines around the key (hand-drawn 2D effect over 3D)
  const [kx, ky] = proj(keyG, 0, -40, 0);
  const R = mulberry(7);
  f.strokeStyle = '#2a1a14'; f.lineCap = 'round';
  for (let i = 0; i < 14; i++) {
    const a = R() * Math.PI * 2, r0 = 95 + R() * 25, r1 = r0 + 30 + R() * 50;
    f.lineWidth = 2 + R() * 3;
    f.beginPath(); f.moveTo(kx + Math.cos(a) * r0, ky + Math.sin(a) * r0 * 1.3); f.lineTo(kx + Math.cos(a) * r1, ky + Math.sin(a) * r1 * 1.3); f.stroke();
  }
  star(kx + 95, ky - 140, 22, '#FFE36B');
  star(kx - 110, ky + 40, 14, '#FFFFFF');
  // burst label at the key
  burst(kx + 150, ky + 40, 58, 11, '#FFE36B', 3);
  f.save(); f.translate(kx + 150, ky + 40); f.rotate(0.12);
  f.font = '400 34px "ZCOOL KuaiLe"'; f.textAlign = 'center'; f.textBaseline = 'middle'; f.fillStyle = '#2a1a14';
  f.fillText('在外面', 0, 2); f.restore();
  // handle label near Clawd's tag
  const [tx, ty] = proj(tag);
  f.font = '700 20px "JetBrains Mono"';
  const lw = f.measureText('qn://handle/github').width + 26;
  f.fillStyle = '#2a1a14'; rr(f, tx - lw / 2 + 4, ty - 152, lw, 38, 19); f.fill();
  f.fillStyle = '#FFF3CF'; rr(f, tx - lw / 2, ty - 156, lw, 38, 19); f.fill();
  f.lineWidth = 3; f.strokeStyle = '#2a1a14'; rr(f, tx - lw / 2, ty - 156, lw, 38, 19); f.stroke();
  f.fillStyle = '#2a1a14'; f.textAlign = 'center'; f.textBaseline = 'middle'; f.fillText("qn://handle/github", tx, ty - 136);
  f.beginPath(); f.moveTo(tx - 8, ty - 118); f.lineTo(tx, ty - 104); f.lineTo(tx + 8, ty - 118); f.fill();
  f.textAlign = 'left';
  // sparkles inside the room
  const [cx, cy] = proj(clawd, 0, 40, 0);
  star(cx - 90, cy - 40, 12, '#FFFFFF'); star(cx + 150, cy - 110, 9, '#FFE36B');
  caption('真实凭证留在宿主侧，Agent 只拿到一张临时句柄。', 'Real credentials stay on the host. The agent holds a handle.');
  macNotification(f, { title: '已拦截：读取 ~/.ssh', body: 'qn/claude-code · 已写入审计记录' });
  cursor(f, 560, 300);
  f.fillStyle = 'rgba(0,0,0,0.004)'; f.fillRect(0, 0, 1, 1);
};

try { await loadFonts(); window.READY = true; } catch (e) { window.FAIL = String(e); }
