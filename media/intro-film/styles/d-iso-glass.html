<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
import { W, H, rr, loadFonts, setupCanvas, drawClawd, key, shield, CLAY } from '/lib/lib.js';

const ctx = setupCanvas();
const C30 = Math.cos(Math.PI / 6), S30 = 0.5;
const OX = 900, OY = 300, S = 1;
// world (x right-down, y left-down, z up) → screen
const P = (x, y, z = 0) => [OX + (x - y) * C30 * S, OY + (x + y) * S30 * S - z * S];

function poly(pts, fill, stroke, lw = 2) {
  ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
// axis-aligned box: top, left (+y face), right (+x face)
function box(x, y, z, w, d, h, cols, stroke) {
  const top = [P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)];
  const left = [P(x, y + d, z + h), P(x + w, y + d, z + h), P(x + w, y + d, z), P(x, y + d, z)];
  const right = [P(x + w, y, z + h), P(x + w, y + d, z + h), P(x + w, y + d, z), P(x + w, y, z)];
  poly(left, cols[1], stroke); poly(right, cols[2], stroke); poly(top, cols[0], stroke);
}

function aurora() {
  ctx.fillStyle = '#F6EEF4'; ctx.fillRect(0, 0, W, H);
  const blobs = [[300, 200, 700, 'rgba(255,184,150,0.75)'], [1600, 160, 700, 'rgba(190,175,255,0.7)'], [1500, 950, 650, 'rgba(150,225,210,0.6)'], [250, 950, 600, 'rgba(255,205,225,0.7)'], [960, 560, 500, 'rgba(255,230,190,0.5)']];
  for (const [x, y, r, c] of blobs) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}

function slab() {
  // the desktop: a giant iso tablet
  const w = 820, d = 640, t = 26;
  ctx.save(); ctx.shadowColor = 'rgba(90,60,110,0.25)'; ctx.shadowBlur = 80; ctx.shadowOffsetY = 40;
  box(-60, -60, -t, w, d, t, ['#FFF', '#E6D9EA', '#D6C6DE'], null);
  ctx.restore();
  box(-60, -60, -t, w, d, t, ['#FFF7F1', '#E9DCEC', '#DACBE3'], 'rgba(255,255,255,0.8)');
  // wallpaper on the screen surface
  const tl = P(-40, -40), br = P(740, 560);
  ctx.save();
  poly([P(-40, -40), P(740, -40), P(740, 560), P(-40, 560)], null); ctx.clip();
  const g = ctx.createLinearGradient(tl[0], tl[1] - 200, br[0], br[1]);
  g.addColorStop(0, '#FFD9C4'); g.addColorStop(0.5, '#F7C9D8'); g.addColorStop(1, '#CFC8F3');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  // menu bar strip along back edge (y = -40)
  poly([P(-40, -40, 0), P(-10, -40, 0), P(-10, 560, 0), P(-40, 560, 0)], 'rgba(255,255,255,0.7)');
  // menu text skewed onto the surface
  ctx.save();
  const [mx, my] = P(-25, 530);
  ctx.setTransform(C30, -S30, C30, S30, mx, my);
  ctx.fillStyle = '#3a2e3f'; ctx.font = '600 15px "Noto Sans SC"'; ctx.textBaseline = 'middle';
  ctx.fillText('qn sandbox    会话   配置档   权限   审计', 0, 0);
  ctx.restore();
  // dock along front edge (x = 740 side → we use y = 540 row)
  const cols = [['#FFC2A4', '#E8865F', '#D97452'], ['#B9CEF7', '#7C9DE2', '#6A8BD3'], ['#C0E6CF', '#7DC09A', '#6AAE88'], ['#FBE2A0', '#E8BB52', '#D9AA40']];
  cols.forEach((c, i) => box(200 + i * 80, 500, 0, 54, 34, 18, c, 'rgba(255,255,255,0.7)'));
}

function sandbox() {
  const x = 60, y = 90, w = 380, d = 320, h = 250;
  // floor plate
  box(x, y, 0, w, d, 10, ['#FBE6D6', '#EBCDB9', '#E0BFA9'], 'rgba(255,255,255,0.9)');
  // back walls (glass, frosted) drawn first
  poly([P(x, y, 10), P(x + w, y, 10), P(x + w, y, h), P(x, y, h)], 'rgba(255,255,255,0.35)', 'rgba(255,255,255,0.95)', 3);
  poly([P(x, y, 10), P(x, y + d, 10), P(x, y + d, h), P(x, y, h)], 'rgba(255,255,255,0.28)', 'rgba(255,255,255,0.95)', 3);
  // interior: rug, cushion, shelf, lamp
  ctx.save(); const [rx, ry] = P(x + 190, y + 170, 10);
  ctx.translate(rx, ry); ctx.scale(1, 0.58); ctx.fillStyle = '#EDA48C'; ctx.beginPath(); ctx.arc(0, 0, 135, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.setLineDash([9, 8]); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 115, 0, 7); ctx.stroke(); ctx.restore();
  box(x + 240, y + 40, 10, 90, 60, 26, ['#B8C6F5', '#8FA2E6', '#7F93D8'], 'rgba(255,255,255,0.6)');
  box(x + 20, y + 10, 120, 150, 26, 8, ['#E2C3A7', '#C9A88E', '#BC9A80'], null);
  box(x + 40, y + 12, 128, 60, 20, 44, ['#9FBDF0', '#7FA7E0', '#6B94D3'], null);
  box(x + 110, y + 14, 128, 16, 16, 36, ['#FCD27A', '#F2B84B', '#E0A63A'], null);
  // lamp
  const [lx, ly] = P(x + 60, y + 290, 10);
  ctx.fillStyle = '#C9A88E'; ctx.fillRect(lx - 3, ly - 150, 6, 150);
  poly([[lx - 34, ly - 150], [lx + 34, ly - 150], [lx + 20, ly - 196], [lx - 20, ly - 196]], '#FFC96B');
  const lg = ctx.createRadialGradient(lx, ly - 130, 5, lx, ly - 90, 220);
  lg.addColorStop(0, 'rgba(255,214,140,0.5)'); lg.addColorStop(1, 'rgba(255,214,140,0)');
  ctx.fillStyle = lg; ctx.fillRect(lx - 260, ly - 320, 520, 520);
  // Clawd stands on the rug, pixel sprite upright (billboard)
  const [cx, cy] = P(x + 170, y + 170, 10);
  drawClawd(ctx, cx, cy, 10, { eyes: 'look-r', shadowColor: 'rgba(120,60,40,0.22)' });
  // handle tag above Clawd
  ctx.save(); ctx.translate(cx + 30, cy - 175); ctx.rotate(-0.06);
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; rr(ctx, 0, 0, 236, 44, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,1)'; ctx.lineWidth = 1.5; rr(ctx, 0, 0, 236, 44, 22); ctx.stroke();
  ctx.fillStyle = '#B9822A'; ctx.beginPath(); ctx.arc(22, 22, 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#3a2e3f'; ctx.font = '600 18px "JetBrains Mono"'; ctx.textBaseline = 'middle'; ctx.fillText('qn://handle/github', 36, 23);
  ctx.restore();
  // front glass walls
  const fr = [P(x + w, y, 10), P(x + w, y + d, 10), P(x + w, y + d, h), P(x + w, y, h)];
  const fl = [P(x, y + d, 10), P(x + w, y + d, 10), P(x + w, y + d, h), P(x, y + d, h)];
  poly(fl, 'rgba(235,245,255,0.16)', 'rgba(255,255,255,0.95)', 3);
  poly(fr, 'rgba(225,235,255,0.22)', 'rgba(255,255,255,0.95)', 3);
  poly([P(x, y, h), P(x + w, y, h), P(x + w, y + d, h), P(x, y + d, h)], 'rgba(255,255,255,0.18)', 'rgba(255,255,255,1)', 3);
  // dispersion edge + glints
  ctx.save(); ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,140,170,0.6)'; ctx.beginPath(); ctx.moveTo(...P(x + w + 2, y + d, h - 2)); ctx.lineTo(...P(x + w + 2, y + d, 12)); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,200,255,0.6)'; ctx.beginPath(); ctx.moveTo(...P(x + w - 2, y + d + 3, h - 2)); ctx.lineTo(...P(x + w - 2, y + d + 3, 12)); ctx.stroke();
  ctx.restore();
  poly([P(x + 40, y + d, h - 20), P(x + 90, y + d, h - 20), P(x + 40, y + d, 90), P(x + 10, y + d, 90)], 'rgba(255,255,255,0.4)');
  // badge on the glass
  const [bx, by] = P(x + w, y + 40, h - 40);
  ctx.save(); ctx.setTransform(C30, -S30, 0, 1, bx, by);
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; rr(ctx, 0, 0, 180, 40, 20); ctx.fill();
  shield(ctx, 22, 20, 9, '#3E9B6F');
  ctx.fillStyle = '#2f7a55'; ctx.font = '700 16px "Noto Sans SC"'; ctx.textBaseline = 'middle'; ctx.fillText('沙箱 · 默认拒绝', 40, 21);
  ctx.restore();
}

function pedestal() {
  // glass plinth outside the sandbox with the floating key
  const x = 700, y = 300;
  box(x, y, 0, 110, 110, 90, ['rgba(255,255,255,0.75)', 'rgba(240,230,250,0.6)', 'rgba(225,215,245,0.6)'], 'rgba(255,255,255,1)');
  const [kx, ky] = P(x + 55, y + 55, 170);
  const g = ctx.createRadialGradient(kx, ky, 4, kx, ky, 150);
  g.addColorStop(0, 'rgba(255,220,130,0.75)'); g.addColorStop(1, 'rgba(255,220,130,0)');
  ctx.fillStyle = g; ctx.fillRect(kx - 160, ky - 160, 320, 320);
  key(ctx, kx - 45, ky + 6, 30, { rot: -0.35 });
  // shadow of the key on the plinth
  const [sx, sy] = P(x + 55, y + 55, 90);
  ctx.save(); ctx.translate(sx, sy); ctx.scale(1, 0.5); ctx.fillStyle = 'rgba(160,110,40,0.2)'; ctx.beginPath(); ctx.arc(0, 0, 40, 0, 7); ctx.fill(); ctx.restore();
}

function glassCard(x, y, w, h, draw) {
  ctx.save();
  ctx.shadowColor = 'rgba(90,60,110,0.18)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16;
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; rr(ctx, x, y, w, h, 26); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 1.5; rr(ctx, x + 0.5, y + 0.5, w - 1, h - 1, 26); ctx.stroke();
  ctx.save(); ctx.translate(x, y); draw(); ctx.restore();
}

window.render = (t) => {
  aurora();
  slab();
  sandbox();
  pedestal();
  glassCard(1380, 470, 420, 250, () => {
    ctx.fillStyle = '#7d6c80'; ctx.font = '600 14px "Noto Sans SC"'; ctx.fillText('审计 · AUDIT', 28, 40);
    const rows = [['已拦截', '读取 ~/.ssh', '#E8584A'], ['已拦截', '外连 unknown.example', '#E8584A'], ['已代用', 'github · 句柄', '#3E9B6F']];
    rows.forEach(([a, b, c], i) => {
      const yy = 80 + i * 54;
      ctx.fillStyle = c; rr(ctx, 28, yy - 16, 76, 32, 16); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '700 15px "Noto Sans SC"'; ctx.textAlign = 'center'; ctx.fillText(a, 66, yy + 5); ctx.textAlign = 'left';
      ctx.fillStyle = '#3a2e3f'; ctx.font = '500 17px "JetBrains Mono"'; ctx.fillText(b, 120, yy + 6);
    });
  });
  glassCard(1440, 160, 360, 120, () => {
    ctx.fillStyle = '#7d6c80'; ctx.font = '600 14px "Noto Sans SC"'; ctx.fillText('宿主侧 · HOST', 28, 40);
    ctx.fillStyle = '#3a2e3f'; ctx.font = '700 24px "Noto Sans SC"'; ctx.fillText('真实凭证不进沙箱', 28, 84);
  });
  // caption: frosted pill
  ctx.font = '500 32px "Noto Sans SC"';
  const text = '文件和网络默认拒绝，按配置档放行。';
  const tw = ctx.measureText(text).width;
  glassCard((W - tw - 90) / 2, 930, tw + 90, 86, () => {
    ctx.fillStyle = '#2e2433'; ctx.font = '500 32px "Noto Sans SC"'; ctx.textAlign = 'center'; ctx.fillText(text, (tw + 90) / 2, 46);
    ctx.font = '500 15px Fredoka'; ctx.fillStyle = '#7d6c80'; ctx.fillText('Files and network: denied by default, allowed by profile.', (tw + 90) / 2, 72); ctx.textAlign = 'left';
  });
  ctx.fillStyle = 'rgba(0,0,0,0.004)'; ctx.fillRect(0, 0, 1, 1);
};

try { await loadFonts(); window.READY = true; } catch (e) { window.FAIL = String(e); }
</script>
