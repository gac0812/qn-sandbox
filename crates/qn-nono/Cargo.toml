[package]
name = "qn-nono"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
flate2 = "1.0"
hex = "0.4"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
ureq = "2.12"
qn-config = { path = "../qn-config", version = "0.1.0" }
qn-core = { path = "../qn-core", version = "0.1.0" }
qn-infra = { path = "../qn-infra", version = "0.1.0" }
camino = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
process-wrap = { version = "8.2.2", default-features = false, features = ["tokio1", "process-group"] }

[[test]]
name = "audit_reader"
harness = false

[[test]]
name = "version_environment"
harness = false

[lints]
workspace = true
