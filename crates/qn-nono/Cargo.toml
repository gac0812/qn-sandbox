[package]
name = "qn-nono"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
flate2 = "1.0"
hex = "0.4"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
ureq = "2.12"
qn-config = { path = "../qn-config", version = "0.1.0" }
qn-core = { path = "../qn-core", version = "0.1.0" }
qn-infra = { path = "../qn-infra", version = "0.1.0" }
camino = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
