[package]
name = "qn-wsl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Windows WSL2 provisioning adapter for qn-sandbox (health probes first)"

[dependencies]
qn-config = { path = "../qn-config", version = "0.1.0" }
qn-infra = { path = "../qn-infra", version = "0.1.0" }
camino = "1"
tracing = "0.1"
qn-nono = { path = "../qn-nono", version = "0.1.0" }
thiserror = "2"

[dev-dependencies]
# 库本体 runtime 无关（async fn 不绑定运行时）；example 与集成测试需要执行器。
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }

[features]
# 真实供给/引导集成测试（本机 opt-in；CI 不启用）。
provision-it = []
bootstrap-it = []

[lints]
workspace = true
