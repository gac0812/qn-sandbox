[package]
name = "qn-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Command-line interface for qn-sandbox"

[[bin]]
name = "qn"
path = "src/main.rs"

[dependencies]
camino = "1"
clap = { version = "4.6.7", features = ["derive"] }
qn-bootstrap = { path = "../qn-bootstrap", version = "0.1.0" }
qn-config = { path = "../qn-config", version = "0.1.0" }
qn-core = { path = "../qn-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "signal", "time"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
