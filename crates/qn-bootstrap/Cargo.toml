[package]
name = "qn-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
qn-infra = { path = "../qn-infra", version = "0.1.0" }
process-wrap = { version = "8.2.2", default-features = false, features = ["tokio1", "kill-on-drop", "process-group", "job-object"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
tokio-util = "0.7"

[[test]]
name = "managed_process"
harness = false

[lints]
workspace = true
