[package]
name = "qn-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
camino = "1"
qn-broker = { path = "../qn-broker", version = "0.1.0" }
qn-config = { path = "../qn-config", version = "0.1.0" }
qn-core = { path = "../qn-core", version = "0.1.0" }
qn-infra = { path = "../qn-infra", version = "0.1.0" }
qn-nono = { path = "../qn-nono", version = "0.1.0" }
process-wrap = { version = "8.2.2", default-features = false, features = ["tokio1", "kill-on-drop", "process-group", "job-object"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt"] }
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }

[dev-dependencies]
tracing = "0.1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }

[[test]]
name = "managed_process"
harness = false

[[test]]
name = "host_provider"
harness = false

[[test]]
name = "capture_service"
harness = false

[lints]
workspace = true
