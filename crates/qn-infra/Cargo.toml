[package]
name = "qn-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Shared mechanisms (process runner, ...) for qn-sandbox; no domain concepts"

[dependencies]
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros"] }
tokio-util = { version = "0.7" }
thiserror = "2"
tracing = "0.1"
camino = "1"
process-wrap = { version = "8.2.2", default-features = false, features = ["tokio1", "kill-on-drop"] }

[lints]
workspace = true
